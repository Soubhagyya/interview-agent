<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AI Interview Agent — Live Demo</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0f1115;
    color: #e8e8e8;
    margin: 0;
    display: flex;
    justify-content: center;
    padding: 24px;
  }
  .app { width: 100%; max-width: 640px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.subtitle { color: #999; font-size: 13px; margin-top: 0; margin-bottom: 20px; }
  #chat {
    background: #1a1d24;
    border-radius: 12px;
    padding: 16px;
    height: 480px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    padding: 10px 14px;
    border-radius: 14px;
    max-width: 80%;
    line-height: 1.4;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .interviewer { background: #2a2f3a; align-self: flex-start; border-bottom-left-radius: 4px; }
  .candidate { background: #3b5bfd; align-self: flex-end; border-bottom-right-radius: 4px; }
  .feedback { background: #1e3a2a; border: 1px solid #2e5a3e; align-self: stretch; max-width: 100%; }
  #inputRow { display: flex; gap: 8px; margin-top: 12px; }
  #answerInput {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #1a1d24;
    color: white;
    font-size: 14px;
  }
  button {
    padding: 12px 18px;
    border-radius: 8px;
    border: none;
    background: #3b5bfd;
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #restartBtn { background: #444; margin-top: 10px; font-size: 12px; padding: 8px 12px; }
  .loading { color: #888; font-style: italic; }
</style>
</head>
<body>
<div class="app">
  <h1>AI Interview Agent</h1>
  <p class="subtitle">Live demo — talking to the real <code>/api/interview</code> endpoint.</p>
  <div id="chat"></div>
  <div id="inputRow">
    <input id="answerInput" type="text" placeholder="Type your answer..." />
    <button id="sendBtn">Send</button>
  </div>
  <button id="restartBtn">Restart Interview</button>
</div>

<script>
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("answerInput");
const sendBtn = document.getElementById("sendBtn");
const restartBtn = document.getElementById("restartBtn");

let sessionId = null;
let candidate = null;
let done = false;

function addMessage(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function addFeedback(fb) {
  const div = document.createElement("div");
  div.className = "msg feedback";
  div.innerHTML = `<strong>Summary:</strong> ${fb.summary}<br><br>` +
    `<strong>Strengths:</strong><ul>${fb.strengths.map(s => `<li>${s}</li>`).join("")}</ul>` +
    `<strong>Gaps:</strong><ul>${fb.gaps.map(s => `<li>${s}</li>`).join("")}</ul>` +
    `<strong>Next steps:</strong><ul>${fb.next.map(s => `<li>${s}</li>`).join("")}</ul>`;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function startInterview() {
  chatEl.innerHTML = "";
  done = false;
  sessionId = "demo-" + Date.now();
  const loading = addMessage("Connecting to interviewer... (may take 20-30s on first load)", "msg loading");

  const res = await fetch("/api/interview", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sessionId, candidate })
  });
  const data = await res.json();
  loading.remove();
  addMessage(data.reply, "interviewer");
  done = data.done;
}

async function sendAnswer() {
  const text = inputEl.value.trim();
  if (!text || done) return;
  addMessage(text, "candidate");
  inputEl.value = "";
  sendBtn.disabled = true;
  const loading = addMessage("...", "loading");

  const res = await fetch("/api/interview", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sessionId, message: text })
  });
  const data = await res.json();
  loading.remove();
  addMessage(data.reply, "interviewer");
  sendBtn.disabled = false;

  if (data.done) {
    done = true;
    if (data.feedback) addFeedback(data.feedback);
  }
}

sendBtn.addEventListener("click", sendAnswer);
inputEl.addEventListener("keydown", e => { if (e.key === "Enter") sendAnswer(); });
restartBtn.addEventListener("click", startInterview);

async function init() {
  const res = await fetch("/api/demo-candidate");
  candidate = await res.json();
  startInterview();
}
init();
</script>
</body>
</html>
